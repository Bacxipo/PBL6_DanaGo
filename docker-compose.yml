services:
  # 1. NestJS API Service (Nối với Supabase qua DATABASE_URL trong api/.env)
  api:
    image: danago_api:latest
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: danago_api
    restart: always
    ports:
      - '5000:5000'
    env_file:
      - ./api/.env
    environment:
      NODE_ENV: production
      PORT: 5000

  # 2. Web du khách (Next.js) - http://localhost:3000
  web:
    image: danago_web:latest
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Trình duyệt gọi API trực tiếp nên dùng localhost (không phải tên service)
        NEXT_PUBLIC_API_URL: http://localhost:5000
        NEXT_PUBLIC_AI_API_URL: http://localhost:8000
    container_name: danago_web
    restart: always
    ports:
      - '3000:3000'
    env_file:
      - ./web/.env.local
    environment:
      NODE_ENV: production
      PORT: 3000
      API_URL: http://api:5000
      WEB_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:5000
      NEXT_PUBLIC_AI_API_URL: http://localhost:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - api

  # 3. Web quản trị (Next.js) - http://localhost:3001
  admin:
    image: danago_admin:latest
    build:
      context: ./WebAdmin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000
        NEXT_PUBLIC_WEB_USER_URL: http://localhost:3000
    container_name: danago_admin
    restart: always
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      PORT: 3001
    depends_on:
      - api
