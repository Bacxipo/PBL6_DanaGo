services:
  # 1. NestJS API Service (Nối với Supabase hoặc Postgres)
  api:
    image: danago_api:latest
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: danago_api
    restart: always
    ports:
      - '5000:5000'
    env_file:
      - ./api/.env
    environment:
      NODE_ENV: production
      PORT: 5000

  # 2. Next.js Web Service
  web:
    image: danago_web:latest
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: danago_web
    restart: always
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:5000
    depends_on:
      - api
